<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stéphanie Rocher — BBS Finance</title>
<meta name="description" content="Stéphanie Rocher, courtière en financement professionnel et immobilier — BBS Finance, Nice.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy-deep:#0B1F3A;
    --navy-mid:#132A4C;
    --brass:#AD8A4E;
    --brass-soft:#D9C393;
    --paper:#F6F3EC;
    --ink:#1B2430;
    --ink-soft:rgba(27,36,48,0.62);
    --line:rgba(11,31,58,0.12);
    --radius:18px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    min-height:100svh;
    background:
      radial-gradient(120% 90% at 50% -10%, #16335c 0%, var(--navy-deep) 55%, #081428 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 18px 48px;
    font-family:'Inter',sans-serif;
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;
    max-width:400px;
    background:var(--paper);
    border-radius:calc(var(--radius) + 6px);
    overflow:hidden;
    box-shadow:0 30px 60px -20px rgba(0,0,0,0.55), 0 0 0 1px rgba(255,255,255,0.04);
  }

  /* ---- Header : arc motif ---- */
  .header{
    position:relative;
    background:linear-gradient(160deg, var(--navy-mid) 0%, var(--navy-deep) 100%);
    padding:44px 28px 34px;
    text-align:center;
    overflow:hidden;
  }
  .arc-motif{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
  }
  .brand-logo{
    position:relative;
    display:block;
    height:26px;
    width:auto;
    margin:0 auto 26px;
    opacity:0.92;
  }
  .badge{
    position:relative;
    width:112px;
    height:112px;
    margin:0 auto 20px;
    border-radius:50%;
    padding:4px;
    background:linear-gradient(150deg, var(--brass-soft), var(--brass));
    box-shadow:0 10px 26px -8px rgba(173,138,78,0.6);
  }
  .badge img{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    display:block;
    border:2.5px solid var(--navy-deep);
  }
  .name{
    position:relative;
    margin:0;
    font-family:'Fraunces',serif;
    font-optical-sizing:auto;
    font-weight:500;
    font-size:28px;
    line-height:1.15;
    color:#FBF8F2;
    letter-spacing:0.005em;
  }
  .title{
    position:relative;
    margin:10px auto 0;
    max-width:250px;
    font-size:12.5px;
    font-weight:500;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:var(--brass-soft);
  }
  .org{
    position:relative;
    margin:14px 0 0;
    font-size:13px;
    color:rgba(251,248,242,0.55);
    letter-spacing:0.02em;
  }

  /* ---- Socials (footer, compact) ---- */
  .social-row{
    display:flex;
    justify-content:center;
    gap:14px;
    padding:20px 26px 4px;
  }
  .social-link{
    display:flex;
    align-items:center;
    justify-content:center;
    text-decoration:none;
  }
  .social-icon{
    width:30px;
    height:30px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:rgba(11,31,58,0.05);
    border:1px solid var(--line);
  }
  .social-icon svg{ width:14px; height:14px; stroke:var(--navy-deep); }

  /* ---- Actions ---- */
  .actions{
    display:flex;
    gap:1px;
    background:var(--line);
    border-bottom:1px solid var(--line);
  }
  .action{
    flex:1 1 0;
    background:var(--paper);
    padding:18px 10px 16px;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    text-decoration:none;
    color:var(--ink);
    transition:background 0.15s ease;
  }
  .action:active{ background:#EDE8DC; }
  .action svg{ width:20px; height:20px; stroke:var(--navy-deep); }
  .action span{ font-size:11.5px; font-weight:600; letter-spacing:0.03em; color:var(--ink-soft); }

  /* ---- Body ---- */
  .body{ padding:26px 26px 8px; }
  .detail-row{
    display:flex;
    align-items:flex-start;
    gap:14px;
    padding:13px 0;
    border-bottom:1px solid var(--line);
  }
  .detail-row:last-child{ border-bottom:none; }
  .detail-row svg{ width:17px; height:17px; margin-top:2px; flex-shrink:0; stroke:var(--brass); }
  .detail-text{ display:flex; flex-direction:column; gap:1px; }
  .detail-label{ font-size:10.5px; letter-spacing:0.05em; text-transform:uppercase; color:var(--ink-soft); }
  .detail-value{ font-size:14.5px; color:var(--ink); font-weight:500; text-decoration:none; }
  .detail-value a{ color:inherit; text-decoration:none; }

  /* ---- Save button ---- */
  .save-wrap{ padding:22px 26px 30px; }
  .save-btn{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:15px 18px;
    background:var(--navy-deep);
    color:#FBF8F2;
    border:none;
    border-radius:12px;
    font-family:'Inter',sans-serif;
    font-size:14.5px;
    font-weight:600;
    letter-spacing:0.02em;
    cursor:pointer;
    transition:transform 0.12s ease, background 0.15s ease;
  }
  .save-btn:active{ transform:scale(0.98); background:#081428; }
  .save-btn svg{ width:17px; height:17px; stroke:var(--brass-soft); }

  .footer{
    text-align:center;
    padding:6px 26px 28px;
    font-size:11px;
    color:var(--ink-soft);
    letter-spacing:0.03em;
  }
  .footer a{ color:var(--navy-deep); text-decoration:none; font-weight:600; border-bottom:1px solid var(--brass); }
  .footer-logo{ display:inline-block; height:34px; width:auto; opacity:0.9; }
</style>
</head>
<body>

  <div class="save-wrap">

<script>
document.getElementById('saveContact').addEventListener('click', function () {
  fetch('contact.vcf')
    .then(function (r) { return r.text(); })
    .then(function (vcf) {
      var blob = new Blob([vcf], { type: 'text/vcard;charset=utf-8' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'Stephanie-Rocher-BBS-Finance.vcf';
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    });
});
</script>

</body>
</html>
